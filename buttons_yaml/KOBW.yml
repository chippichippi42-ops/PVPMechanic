    - '&7 + Có xác suất {value_0}% giảm {value_2}% sát thương.'
    - '&7Đồng thời, với mỗi 10% máu mất đi,'
    - '&7tăng {value_3}% mọi ST, mọi giảm ST.'
    - '&7Và khi máu <= 50% mà phải chịu ST sẽ'
    - '&7đưa bản thân vào trạng thái &c&lđạo tàn bụ'
    - '&7trong {value_4} giây. (Hồi chiêu: 6 giây).'
    - '&8* &c&lĐạo tàn bụ: tăng 8% TLCM, 20% STCM.'
    - '{state}'