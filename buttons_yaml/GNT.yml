    - '&7Sau khi bắt đầu trận đấu, cứ mỗi {value_0} giây sẽ'
    - '&7được tăng 1 máu tối đa. Tối đa 5 điểm.'
    - '&cMộ đá X'
    - ''
    - '&eBạn cần &d{cost} &eđá linh hồn để nâng cấp!'
    - '&bChuột phải để nâng cấp nhanh!'
    - '{state}'