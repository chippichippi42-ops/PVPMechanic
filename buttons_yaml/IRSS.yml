    - '&7{value_1} thỏi vàng.'
    - '&cThợ săn tiền thưởng X'
    - ''
    - '&eBạn cần &d{cost} &eđá linh hồn để nâng cấp!'
    - '&bChuột phải để nâng cấp nhanh!'
    - '{state}'